<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Worn-In · Old Clothes, New Scent</title>
<link rel="stylesheet" href="play.css?v=20">
</head>
<body>
<!-- 猫眼入口门：点击猫眼后网站才开始 -->
<div id="catGate">
  <canvas id="catCv"></canvas>
  <div id="catTouch">touch me</div>
  <div id="catPerfume">let me make your clothes into a perfume</div>
  <div id="catStatus"></div>
</div>

<div id="stageBox">
  <canvas id="cv"></canvas>
  <div id="fx"></div>            <!-- 飘句/香料标签层 -->
  <div id="hud"></div>           <!-- 提示文字 -->
  <div id="bottomBar" class="hidden"></div>
  <div id="toast"></div>
</div>

<!-- 拍照浮层：全屏镜头 + 影院倒计时 -->
<div id="camOverlay" class="overlay hidden">
  <div id="camView">
    <video id="video" playsinline muted></video>
    <canvas id="photoShot" class="hidden"></canvas>
    <div id="countdown" class="hidden">
      <svg id="cdRing" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/>
        <circle id="cdArc" cx="50" cy="50" r="46" fill="none" stroke="#ffe2ae" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 50 50)"/>
      </svg>
      <span id="countNum">3</span>
    </div>
    <button id="camClose" aria-label="Close">✕</button>
    <div id="camDone" class="hidden">
      <button id="btnRetake">↺ Retake</button>
      <button id="btnOk">Blend</button>
    </div>
  </div>
</div>

<!-- AI 加载遮罩 -->
<div id="aiLoading" class="overlay hidden">
  <div class="aiCard">
    <div class="spinner"></div>
    <div id="aiText">AI is blending your scent…</div>
    <div id="aiErr" class="hidden"></div>
  </div>
</div>

<!-- Key 设置 -->
<div id="keyPanel" class="hidden">
  <p>OpenAI API Key (stored in this browser only)</p>
  <input id="keyInput" type="password" placeholder="sk-...">
  <button id="keySave">Save</button>
  <span id="keyHint" class="hidden">✓ Saved</span>
</div>

<script src="js/apikey.js"></script>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="js/copykit.js?v=4"></script>
<script type="module" src="js/catgate.js?v=5"></script>
<script src="js/play.js?v=83"></script>
</body>
</html>
