<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worn-In 分段编辑器</title>
<link rel="stylesheet" href="editor.css?v=5">
</head>
<body>
<div id="top">
  <h1>Worn-In 分段编辑器</h1>
  <div id="segs"></div>
  <div class="tools">
    <button id="btnPlay">⏸ 暂停预览</button>
    <button id="btnSave">💾 一键保持所有位置</button>
    <button id="btnExport">导出配置 JSON</button>
    <button id="btnImport">导入配置</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button id="btnPhoto">上传衣物照片(段1)</button>
    <input type="file" id="photoFile" accept="image/*" hidden>
  </div>
</div>
<div id="toast"></div>

<div id="main">
  <div id="stageBox"><canvas id="cv"></canvas></div>
  <div id="panel">
    <h3 id="segTitle"></h3>
    <p id="segHint" class="hint"></p>
    <div id="layers"></div>
  </div>
</div>
<script src="editor.js?v=6"></script>
</body>
</html>
