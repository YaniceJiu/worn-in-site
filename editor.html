<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worn-In Segment Editor</title>
<link rel="stylesheet" href="editor.css?v=5">
</head>
<body>
<div id="top">
  <h1>Worn-In Segment Editor</h1>
  <div id="segs"></div>
  <div class="tools">
    <button id="btnPlay">⏸ Pause preview</button>
    <button id="btnReplay">↺ Replay from start</button>
    <button id="btnSave">💾 Save all positions</button>
    <button id="btnExport">Export config JSON</button>
    <button id="btnImport">Import config</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button id="btnPhoto">Upload garment photo</button>
    <input type="file" id="photoFile" accept="image/*" hidden>
    <button id="btnSample">🖼 Sample photo</button>
  </div>
</div>
<div id="toast"></div>

<div id="main">
  <div id="stageBox"><canvas id="cv"></canvas></div>
  <div id="panel">
    <h3 id="segTitle"></h3>
    <p id="segHint" class="hint"></p>
    <div id="layers"></div>
  </div>
</div>
<script src="editor.js?v=31"></script>
</body>
</html>
